# PR Checks: run every pre-commit hook (black, isort, flake8, mypy, pytest and hygiene hooks).
# The pytest hook runs the full test suite, so there is no separate test job.

name: PR Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pr-checks:
    name: Pre-commit checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Set Poetry to use in-project virtualenv
        run: poetry config virtualenvs.in-project true
      - name: Cache Poetry virtualenv and pre-commit environments
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
            ~/.cache/pre-commit
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock', '.pre-commit-config.yaml') }}
      - name: Install dependencies
        run: poetry install

      - name: Run all pre-commit hooks (including mypy and pytest)
        run: poetry run pre-commit run --all-files --show-diff-on-failure
